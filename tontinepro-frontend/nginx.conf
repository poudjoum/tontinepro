server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Compression ──────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        image/svg+xml font/woff font/woff2;

    # ── En-têtes de sécurité ─────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── Proxy API → backend Spring Boot ─────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 12m;
    }

    # ── Assets statiques (cache long) ───────────────────────────────
    location ~* \.(js|css|woff|woff2|ttf|eot|png|jpg|jpeg|gif|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── Favicon & manifest — cache court pour faciliter les mises à jour ──
    location ~* \.(ico|webmanifest)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # ── Documents téléchargeables ────────────────────────────────────
    # URLs sans hash : on force la revalidation pour qu'une nouvelle
    # version publiee soit servie immediatement (ETag/Last-Modified).
    location ~* \.(pdf|pptx|ppt|docx|xlsx)$ {
        add_header Cache-Control "public, no-cache, must-revalidate";
        add_header Content-Disposition "inline";
        access_log off;
    }

    # ── SPA Angular — toutes les routes → index.html ─────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
