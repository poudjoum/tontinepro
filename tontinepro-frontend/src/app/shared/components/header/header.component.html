<header class="fixed top-0 left-0 right-0 z-40 bg-white border-b border-gray-200 safe-area-top">
  <div class="flex items-center justify-between h-14 px-4 max-w-2xl mx-auto">

    <!-- Logo -->
    <a routerLink="/dashboard" class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-xl bg-primary-600 flex items-center justify-center">
        <span class="text-white font-bold text-sm">T</span>
      </div>
      <span class="font-bold text-gray-900 text-base">TontinePro</span>
    </a>

    <!-- Actions -->
    <div class="flex items-center gap-3">

      <!-- Cloche notifications -->
      <a routerLink="/notifications"
         class="relative min-h-tap min-w-[44px] flex items-center justify-center">
        <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
        </svg>
        @if (notifs.unreadCount() > 0) {
          <span class="absolute top-1 right-1 w-4 h-4 bg-red-500 rounded-full
                       flex items-center justify-center text-white text-[10px] font-bold">
            {{ notifs.unreadCount() > 9 ? '9+' : notifs.unreadCount() }}
          </span>
        }
      </a>

      <!-- Avatar / Profil -->
      <a routerLink="/profil"
         class="w-8 h-8 rounded-full bg-primary-100 flex items-center justify-center">
        <span class="text-primary-700 font-semibold text-sm uppercase">
          {{ auth.currentUser()?.email?.charAt(0) }}
        </span>
      </a>
    </div>

  </div>
</header>

<!-- Espaceur pour le contenu sous le header fixe -->
<div class="h-14"></div>
