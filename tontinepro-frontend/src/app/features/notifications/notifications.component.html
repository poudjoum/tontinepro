<div class="space-y-3">
  <h1 class="text-xl font-bold text-gray-900">Notifications</h1>

  @if (notifications.length === 0) {
    <div class="card text-center py-8 text-gray-400">
      <p>Aucune notification</p>
    </div>
  }

  @for (n of notifications; track n.id) {
    <div class="card flex items-start gap-3"
         [class.opacity-60]="n.lu">
      <div class="w-2 h-2 rounded-full mt-2 flex-shrink-0"
           [class.bg-primary-600]="!n.lu"
           [class.bg-gray-300]="n.lu"></div>
      <div class="flex-1 min-w-0">
        <p class="font-semibold text-sm text-gray-900">{{ n.titre }}</p>
        <p class="text-sm text-gray-600 mt-0.5">{{ n.message }}</p>
        <p class="text-xs text-gray-400 mt-1">
          {{ n.createdAt | date:'dd/MM/yyyy HH:mm' }}
        </p>
      </div>
    </div>
  }
</div>
