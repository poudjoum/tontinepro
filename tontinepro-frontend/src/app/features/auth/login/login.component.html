<div class="min-h-screen bg-gradient-to-br from-primary-600 to-primary-700
            flex flex-col items-center justify-center px-4 py-8">

  <!-- Card -->
  <div class="w-full max-w-sm bg-white rounded-3xl shadow-2xl overflow-hidden">

    <!-- Header card -->
    <div class="bg-primary-600 px-6 pt-8 pb-6 text-center">
      <div class="w-16 h-16 rounded-2xl bg-white/20 flex items-center justify-center mx-auto mb-3">
        <span class="text-white font-bold text-3xl">T</span>
      </div>
      <h1 class="text-white text-2xl font-bold">TontinePro</h1>
      <p class="text-primary-200 text-sm mt-1">Gérez votre tontine facilement</p>
    </div>

    <!-- Formulaire -->
    <form [formGroup]="form" (ngSubmit)="submit()" class="px-6 py-6 space-y-4">

      <h2 class="text-gray-900 font-semibold text-lg">Se connecter</h2>

      @if (error()) {
        <div class="bg-red-50 border border-red-200 rounded-xl px-4 py-3 text-red-700 text-sm">
          {{ error() }}
        </div>
      }

      <!-- Identifiant : email ou téléphone -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Email ou téléphone</label>
        <input formControlName="email" type="text" autocomplete="username"
               placeholder="vous@exemple.com ou 6XX XXX XXX"
               class="input-field"
               [class.border-red-400]="form.get('email')?.invalid && form.get('email')?.touched">
      </div>

      <!-- Mot de passe -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Mot de passe</label>
        <div class="relative">
          <input formControlName="password"
                 [type]="showPass() ? 'text' : 'password'"
                 autocomplete="current-password"
                 placeholder="••••••••"
                 class="input-field pr-12"
                 [class.border-red-400]="form.get('password')?.invalid && form.get('password')?.touched">
          <button type="button" (click)="showPass.set(!showPass())"
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 p-1">
            @if (showPass()) {
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
              </svg>
            } @else {
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
              </svg>
            }
          </button>
        </div>
      </div>

      <!-- Bouton -->
      <button type="submit" class="btn-primary mt-2" [disabled]="loading()">
        @if (loading()) {
          <svg class="animate-spin w-5 h-5 mr-2" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
            <path class="opacity-75" fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
          </svg>
          Connexion…
        } @else {
          Se connecter
        }
      </button>

      <!-- Mot de passe oublié -->
      <p class="text-center">
        <a routerLink="/auth/mot-de-passe-oublie"
           class="text-sm text-gray-400 hover:text-primary-600 hover:underline transition-colors">
          Mot de passe oublié ?
        </a>
      </p>

      <!-- Lien inscription -->
      <p class="text-center text-sm text-gray-500 pt-1">
        Pas encore de compte ?
        <a routerLink="/auth/register" class="text-primary-600 font-semibold">
          Créer un compte
        </a>
      </p>

    </form>
  </div>

</div>
