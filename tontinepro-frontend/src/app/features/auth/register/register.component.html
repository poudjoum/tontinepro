<div class="min-h-screen bg-gradient-to-br from-primary-600 to-primary-700
            flex flex-col items-center justify-center px-4 py-8">

  <div class="w-full max-w-sm bg-white rounded-3xl shadow-2xl overflow-hidden">

    <!-- Header -->
    <div class="bg-primary-600 px-6 pt-8 pb-5 text-center">
      <h1 class="text-white text-xl font-bold">Créer un compte</h1>
      <p class="text-primary-200 text-sm mt-1">Rejoignez TontinePro</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="px-6 py-6 space-y-4">

      @if (error()) {
        <div class="bg-red-50 border border-red-200 rounded-xl px-4 py-3 text-red-700 text-sm">
          {{ error() }}
        </div>
      }

      <!-- Email -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Email *</label>
        <input formControlName="email" type="email" autocomplete="email"
               placeholder="vous@exemple.com" class="input-field"
               [class.border-red-400]="form.get('email')?.invalid && form.get('email')?.touched">
      </div>

      <!-- Téléphone -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">
          Téléphone <span class="text-gray-400 font-normal">(optionnel)</span>
        </label>
        <input formControlName="telephone" type="tel" autocomplete="tel"
               placeholder="+225 07 00 00 00 00" class="input-field">
      </div>

      <!-- Mot de passe -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Mot de passe *</label>
        <div class="relative">
          <input formControlName="password"
                 [type]="showPass() ? 'text' : 'password'"
                 autocomplete="new-password"
                 placeholder="8 caractères minimum" class="input-field pr-12"
                 [class.border-red-400]="form.get('password')?.invalid && form.get('password')?.touched">
          <button type="button" (click)="showPass.set(!showPass())"
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 p-1">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Confirmation -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Confirmer le mot de passe *</label>
        <input formControlName="confirm"
               [type]="showPass() ? 'text' : 'password'"
               autocomplete="new-password"
               placeholder="••••••••" class="input-field"
               [class.border-red-400]="form.errors?.['mismatch'] && form.get('confirm')?.touched">
        @if (form.errors?.['mismatch'] && form.get('confirm')?.touched) {
          <p class="text-red-500 text-xs mt-1">Les mots de passe ne correspondent pas</p>
        }
      </div>

      <button type="submit" class="btn-primary mt-2" [disabled]="loading()">
        @if (loading()) {
          <svg class="animate-spin w-5 h-5 mr-2" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
          </svg>
          Création…
        } @else {
          Créer mon compte
        }
      </button>

      <p class="text-center text-sm text-gray-500 pt-1">
        Déjà un compte ?
        <a routerLink="/auth/login" class="text-primary-600 font-semibold">Se connecter</a>
      </p>

    </form>
  </div>
</div>
