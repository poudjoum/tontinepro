<div class="min-h-screen bg-gray-50 flex items-center justify-center px-4">
  <div class="w-full max-w-sm space-y-6">

    <div class="text-center">
      <div class="w-16 h-16 rounded-2xl bg-gray-900 flex items-center justify-center mx-auto mb-4">
        <span class="text-2xl">🔒</span>
      </div>
      <h1 class="text-xl font-bold text-gray-900">Changement de mot de passe</h1>
      <p class="text-sm text-gray-500 mt-1">TontinePro</p>
    </div>

    <div class="bg-amber-50 border border-amber-200 rounded-2xl p-4 text-sm text-amber-800">
      Pour des raisons de sécurité, vous devez choisir un nouveau mot de passe
      personnel avant d'accéder à l'application.
    </div>

    <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 space-y-4">

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Nouveau mot de passe</label>
        <input [value]="nouveauMdp()" (input)="nouveauMdp.set($any($event.target).value)"
               type="password" placeholder="8 caractères minimum" class="input-field" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1.5">Confirmer le mot de passe</label>
        <input [value]="confirmation()" (input)="confirmation.set($any($event.target).value)"
               type="password" placeholder="Répétez le mot de passe" class="input-field" />
      </div>

      @if (error()) {
        <div class="bg-red-50 text-red-700 text-sm rounded-lg px-3 py-2">{{ error() }}</div>
      }

      <button (click)="soumettre()"
              [disabled]="submitting() || nouveauMdp().length < 8 || !confirmation()"
              class="btn-primary w-full">
        @if (submitting()) { Enregistrement… } @else { Enregistrer et continuer }
      </button>

      <button (click)="deconnexion()" class="w-full text-sm text-gray-500 mt-1">
        Se déconnecter
      </button>
    </div>

  </div>
</div>
