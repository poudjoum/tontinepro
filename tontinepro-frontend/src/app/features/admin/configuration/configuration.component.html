<div class="space-y-4">
  <h1 class="text-xl font-bold text-gray-900">Configuration de la tontine</h1>

  @if (loading()) {
    <div class="text-center py-8 text-gray-400">Chargement…</div>
  } @else if (tontine()) {
    <form (ngSubmit)="sauvegarder()" class="space-y-4">

      <!-- Infos générales -->
      <section class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 space-y-3">
        <h2 class="text-sm font-semibold text-gray-700 uppercase tracking-wide">Informations</h2>

        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">Nom</label>
          <input [(ngModel)]="form.nom" name="nom" type="text"
                 class="input-field" required />
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">Description</label>
          <textarea [(ngModel)]="form.description" name="description" rows="2"
                    class="input-field resize-none"></textarea>
        </div>
      </section>

      <!-- Cotisation -->
      <section class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 space-y-3">
        <h2 class="text-sm font-semibold text-gray-700 uppercase tracking-wide">Cotisation</h2>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Montant (FCFA)</label>
            <input [(ngModel)]="form.montantCotisation" name="montantCotisation"
                   type="number" min="0" class="input-field" />
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Jour du mois</label>
            <input [(ngModel)]="form.jourCotisation" name="jourCotisation"
                   type="number" min="1" max="28" class="input-field" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">Période</label>
          <select [(ngModel)]="form.periodeCotisation" name="periodeCotisation" class="input-field">
            @for (p of periodes; track p.value) {
              <option [value]="p.value">{{ p.label }}</option>
            }
          </select>
        </div>
      </section>

      <!-- Taux financiers -->
      <section class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 space-y-3">
        <h2 class="text-sm font-semibold text-gray-700 uppercase tracking-wide">Taux financiers</h2>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Taux intérêt prêt (%)</label>
            <input [(ngModel)]="form.tauxInteretPret" name="tauxInteretPret"
                   type="number" step="0.01" min="0" class="input-field" />
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Taux intérêt épargne (%)</label>
            <input [(ngModel)]="form.tauxInteretEpargne" name="tauxInteretEpargne"
                   type="number" step="0.01" min="0" class="input-field" />
          </div>
        </div>
      </section>

      <!-- Sanctions -->
      <section class="bg-white rounded-xl p-4 shadow-sm border border-gray-100 space-y-3">
        <h2 class="text-sm font-semibold text-gray-700 uppercase tracking-wide">Sanctions</h2>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Amende absence (FCFA)</label>
            <input [(ngModel)]="form.montantAmende" name="montantAmende"
                   type="number" min="0" class="input-field" />
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Pénalité retard/jour (FCFA)</label>
            <input [(ngModel)]="form.montantPenaliteRetard" name="montantPenaliteRetard"
                   type="number" min="0" class="input-field" />
          </div>
        </div>
      </section>

      <!-- Messages -->
      @if (success()) {
        <div class="bg-green-50 border border-green-200 text-green-700 text-sm rounded-lg px-4 py-3">
          {{ success() }}
        </div>
      }
      @if (error()) {
        <div class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg px-4 py-3">
          {{ error() }}
        </div>
      }

      <button type="submit" [disabled]="saving()"
              class="btn-primary w-full">
        @if (saving()) { Enregistrement… } @else { Enregistrer }
      </button>
    </form>
  }
</div>
