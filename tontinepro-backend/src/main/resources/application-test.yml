# Profil test — utilisé par les tests unitaires/intégration avec Testcontainers
# Les URLs de PostgreSQL et Redis sont injectées automatiquement par @ServiceConnection

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tontinepro_test
    username: test
    password: test
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  data:
    redis:
      host: localhost
      port: 6379

  mail:
    host: localhost
    port: 1025
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

app:
  jwt:
    secret: test-secret-key-that-is-at-least-32-chars-long-for-testing
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
