spring:
  application:
    name: tontinepro-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev,local}

  jpa:
    hibernate:
      # none : Flyway est la seule source de vérité (validate-on-migrate: true)
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  data:
    redis:
      timeout: 2000ms

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8080
  servlet:
    context-path: /

# Documentation OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true

logging:
  level:
    org.flywaydb: INFO
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}

  mail:
    from: ${MAIL_FROM:noreply@tontinepro.com}

app:
  jwt:
    secret: ${JWT_SECRET:changeme-dev-secret-must-be-at-least-32-chars-long}
    access-token-expiration-ms: ${JWT_ACCESS_EXP_MS:900000}      # 15 min
    refresh-token-expiration-ms: ${JWT_REFRESH_EXP_MS:604800000} # 7 jours
  minio:
    endpoint:   ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:tontinepro}
    secret-key: ${MINIO_SECRET_KEY:changeme-minio-secret}
