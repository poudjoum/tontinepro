name: CI — Build & Test

on:
  push:
    branches: [master, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [master, develop]

jobs:

  # ── Backend : compilation + tests ─────────────────────────────────
  backend:
    name: Backend (Java 21 / Spring Boot)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       tontinepro_test
          POSTGRES_USER:     test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d tontinepro_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Compile & run tests
        working-directory: tontinepro-backend
        run: mvn verify -q
        env:
          SPRING_PROFILES_ACTIVE:      dev
          SPRING_DATASOURCE_URL:       jdbc:postgresql://localhost:5432/tontinepro_test
          SPRING_DATASOURCE_USERNAME:  test_user
          SPRING_DATASOURCE_PASSWORD:  test_pass
          SPRING_DATA_REDIS_HOST:      localhost
          SPRING_DATA_REDIS_PORT:      6379
          JWT_SECRET: ci-test-secret-key-that-is-at-least-32-chars-long

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: tontinepro-backend/target/surefire-reports/

  # ── Frontend : build Angular ───────────────────────────────────────
  frontend:
    name: Frontend (Angular 19 / Node 20)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tontinepro-frontend/package-lock.json

      - name: Install dependencies
        working-directory: tontinepro-frontend
        run: npm ci --ignore-scripts

      - name: Build (production)
        working-directory: tontinepro-frontend
        run: npm run build -- --configuration production

      - name: Check build output
        run: |
          ls -lh tontinepro-frontend/dist/tontinepro-frontend/browser/
          echo "Build size: $(du -sh tontinepro-frontend/dist/tontinepro-frontend/browser/ | cut -f1)"
