name: CD — Deploy (self-hosted)

on:
  push:
    branches: [master]
    paths-ignore:
      - 'tontinepro-frontend/android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to server
    runs-on: self-hosted

    steps:
      - name: Pull latest code
        run: |
          cd /opt/tontinepro
          git pull origin master

      - name: Rebuild and restart containers
        run: |
          cd /opt/tontinepro
          docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

      - name: Clean up old images
        run: docker image prune -f

      - name: Health check
        run: |
          echo "Waiting for backend to start..."
          sleep 30
          curl -sf http://localhost:8080/api/v1/setup/status && echo "Backend OK" || echo "Backend not ready yet (may still be starting)"
