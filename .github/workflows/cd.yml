name: CD — Build & Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:   # déclenchement manuel possible

env:
  SERVER_HOST: 192.168.1.209
  SERVER_USER: jumpy

jobs:

  # ── Build des images Docker ────────────────────────────────────────
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Connexion au registry (GitHub Container Registry)
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # ── Image Backend ────────────────────────────────────────────────
      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./tontinepro-backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tontinepro-backend:latest
            ghcr.io/${{ github.repository_owner }}/tontinepro-backend:${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      # ── Image Frontend ───────────────────────────────────────────────
      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./tontinepro-frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/tontinepro-frontend:latest
            ghcr.io/${{ github.repository_owner }}/tontinepro-frontend:${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  # ── Déploiement sur 192.168.1.209 ────────────────────────────────
  deploy:
    name: Deploy to 192.168.1.209
    runs-on: ubuntu-latest
    needs: build-images
    environment: production

    steps:
      - uses: actions/checkout@v4

      # Copie du docker-compose et du .env sur le serveur
      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key:      ${{ secrets.SERVER_SSH_KEY }}
          source:   "docker-compose.prod.yml"
          target:   "/opt/tontinepro"

      # Déploiement via SSH
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key:      ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /opt/tontinepro

            # Pull des nouvelles images
            docker pull ghcr.io/${{ github.repository_owner }}/tontinepro-backend:latest
            docker pull ghcr.io/${{ github.repository_owner }}/tontinepro-frontend:latest

            # Redémarrage avec zero-downtime (rolling update)
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Nettoyage des anciennes images
            docker image prune -f

            echo "✓ Déploiement terminé — $(date)"
